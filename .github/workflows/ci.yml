name: Testes e pacote

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Instalar dependências
        run: uv sync --locked --group dev
      - name: Validar sintaxe dos instaladores no Windows PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $arquivos = Get-ChildItem -Path . -Filter '*.ps1' -Recurse -File | Where-Object { $_.FullName -notmatch '[\\/]\.venv[\\/]' }
          foreach ($arquivo in $arquivos) {
            $tokens = $null
            $erros = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($arquivo.FullName, [ref]$tokens, [ref]$erros)
            if ($erros.Count) { throw ($erros | Out-String) }
          }
      - name: Testar
        run: uv run --locked --group dev pytest -q
      - name: Testar cópia e permissões dos instaladores Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/validar_instalacao_windows.ps1
      - name: Gerar pacote
        run: uv build --no-sources
